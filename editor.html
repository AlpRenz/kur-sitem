<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kur — Düzenleyici</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#192631;--muted:#667680;--line:#dce5de;--purple:#5947ff;--paper:#f5f7f4}*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea{font:inherit}button{border:0;cursor:pointer;font-weight:800}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:950;font-size:25px;letter-spacing:-1.8px}.brand i{display:inline-block;background:var(--purple);border-radius:50%;width:9px;height:9px;margin:0 2px 4px}.back{background:none;color:var(--muted)}.top-right{display:flex;gap:12px;align-items:center}.save{background:var(--purple);color:#fff;padding:11px 15px;border-radius:8px}.saved{color:#529071;font-size:12px}.layout{display:grid;grid-template-columns:280px 1fr 285px;min-height:calc(100vh - 68px)}.panel{background:#fff;border-right:1px solid var(--line);padding:23px 18px}.panel.right{border-right:0;border-left:1px solid var(--line)}h3{font-size:14px;margin:0 0 16px}.site-name{font-size:19px;letter-spacing:-.7px;margin-bottom:4px}.sub{font-size:12px;color:var(--muted);margin-bottom:24px}.block-add{width:100%;background:#f2f4f1;border:1px solid var(--line);padding:12px;text-align:left;border-radius:8px;margin:7px 0}.block-add:hover{border-color:var(--purple);color:var(--purple)}.block-list{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.block-item{padding:10px 6px;border-bottom:1px solid #edf0ed;color:#50606a;font-size:13px}.canvas-wrap{padding:42px;overflow:auto}.canvas-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:13px}.page{background:#fff;max-width:700px;min-height:650px;margin:auto;box-shadow:0 14px 38px rgba(28,47,39,.12);border-radius:5px;overflow:hidden}.page-nav{height:55px;padding:0 32px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:850}.page-nav span:last-child{font-weight:500;color:#667}.hero{padding:94px 12%;background:var(--accent,#d6ff4d)}.hero h1{font-size:clamp(36px,5vw,64px);letter-spacing:-3px;line-height:.95;max-width:470px;margin:0}.hero p{line-height:1.55;max-width:390px;margin:20px 0}.hero button{background:var(--ink);color:white;border-radius:5px;padding:11px 15px}.page-block{padding:28px 12%;border-bottom:1px solid #edf0ed}.page-block h2{margin:0 0 8px;font-size:25px;letter-spacing:-1px}.page-block p{color:#5e6c74;line-height:1.55;margin:0}.page-block.quote{background:#f0edff}.empty-preview{padding:35px 12%;color:#82918a;font-size:13px}.field{display:block;font-size:12px;font-weight:800;margin:18px 0 6px}.panel input,.panel textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;resize:vertical}.color-row{display:flex;gap:10px;align-items:center}.panel input[type=color]{width:42px;height:36px;padding:3px}.tip{margin-top:25px;border-radius:9px;background:#edf8f0;padding:13px;color:#3e6450;font-size:12px;line-height:1.45}.hidden{display:none}@media(max-width:950px){.layout{grid-template-columns:220px 1fr}.right{display:none}.canvas-wrap{padding:25px}.hero{padding:70px 10%}}@media(max-width:650px){.layout{grid-template-columns:1fr}.panel{display:none}.canvas-wrap{padding:15px}.top{padding:0 15px}.top-right .saved{display:none}.page{min-height:500px}}
</style></head><body>
<header class="top"><button class="back" onclick="location.href='index.html'">← Sitelerim</button><div class="brand">kur<i></i></div><div class="top-right"><span id="status" class="saved">Hazır</span><button class="save" onclick="saveSite()">Kaydet</button></div></header>
<main class="layout"><aside class="panel"><div class="site-name" id="siteName">Siten</div><div class="sub" id="templateName">Düzenleme modu</div><h3>Blok ekle</h3><button class="block-add" onclick="addBlock('text')">＋ Metin bölümü</button><button class="block-add" onclick="addBlock('quote')">＋ Vurgu bölümü</button><button class="block-add" onclick="addBlock('contact')">＋ İletişim bölümü</button><div class="block-list"><h3>Sayfadaki bölümler</h3><div id="blockList"></div></div></aside><section class="canvas-wrap"><div class="canvas-label">CANLI ÖNİZLEME</div><article class="page" id="preview"></article></section><aside class="panel right"><h3>Seçili alan: Ana bölüm</h3><label class="field">Başlık</label><textarea id="headline" rows="3" oninput="syncPreview()"></textarea><label class="field">Açıklama</label><textarea id="subtitle" rows="4" oninput="syncPreview()"></textarea><label class="field">Buton yazısı</label><input id="buttonText" oninput="syncPreview()"><label class="field">Vurgu rengi</label><div class="color-row"><input id="accent" type="color" oninput="syncPreview()"><span id="colorValue"></span></div><div class="tip">İpucu: Sol taraftan bölümler ekle. Kaydettiğinde değişikliklerin yalnızca sana ait olarak saklanır.</div></aside></main>
<script src="config.js"></script><script src="editor.js"></script></body></html>
